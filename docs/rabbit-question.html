<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimroot Trials question</title>
<style>
:root{color-scheme:dark;--black:#09090d;--panel:#12121b;--white:#f4f4ef;--muted:#aaaab6;--cyan:#37e8ff;--pink:#ff37bb;--yellow:#f5ff37;--green:#a7ff42}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);font-family:Arial,sans-serif;color:var(--white)}
body{min-height:100vh;padding:clamp(18px,4vw,52px);display:grid;place-items:center;overflow-x:hidden}
.environment{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;filter:saturate(1.08) brightness(.72);transition:opacity .35s ease}
.veil{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 44%,rgba(9,9,13,.18),rgba(9,9,13,.68) 70%,rgba(9,9,13,.92));pointer-events:none}
.scene{position:relative;z-index:2;width:min(100%,760px);display:grid;grid-template-columns:minmax(0,760px);align-items:end;justify-content:center;gap:clamp(10px,3vw,36px)}
.scene.has-guardian{width:min(100%,1120px);grid-template-columns:minmax(220px,380px) minmax(0,760px)}
.guardian{display:none;width:100%;max-height:78vh;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 22px 28px rgba(0,0,0,.55));transform-origin:center bottom;animation:guardian-breathe 5s ease-in-out infinite}
.guardian.visible{display:block}
.character-stage{position:relative;display:none;min-height:260px;isolation:isolate}
.scene.has-guardian .character-stage{display:grid;place-items:end center}
.portal{position:absolute;inset:8% 10%;border:7px solid #c9ff72;border-radius:50%;background:radial-gradient(ellipse,#090b16 28%,#51318b 60%,#b5ff56 72%,transparent 76%);box-shadow:0 0 28px #a7ff42,inset 0 0 38px #37e8ff;opacity:0;transform:scaleX(0);pointer-events:none;z-index:-1}
.character-stage .guardian{grid-area:1/1;position:relative;z-index:1}
body[data-character="rootwhisper"] .environment{filter:saturate(1.2) brightness(.78) hue-rotate(8deg)}
body[data-character="grumblebark"] .environment{filter:saturate(.85) brightness(.66) sepia(.18)}
body[data-character="tanglebright"] .environment{filter:saturate(.9) brightness(.52) hue-rotate(325deg)}
.card{position:relative;overflow:hidden;width:100%;padding:32px;background:linear-gradient(160deg,rgba(18,18,27,.94),rgba(9,9,13,.96));backdrop-filter:blur(12px);border:1px solid rgba(125,232,255,.38);border-radius:24px;box-shadow:0 18px 54px rgba(0,0,0,.52)}
.card:before{content:"";position:absolute;z-index:0;width:220px;height:220px;right:-100px;top:-70px;border-radius:50%;background:var(--pink);filter:blur(110px);opacity:.14;pointer-events:none}
.card>*{position:relative;z-index:1}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:900;line-height:1.3;letter-spacing:.15em;text-transform:uppercase}
.progress{height:5px;margin:12px 0 24px;background:#282832;border-radius:99px;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .2s ease}
h1{margin:0 0 10px;color:var(--white);font-size:clamp(24px,4.8vw,36px);line-height:1.15}
.hint{margin:0 0 22px;color:var(--muted);font-size:16px;line-height:1.5}
.vault-fact{margin:0 0 22px;padding:16px;border:1px solid #537469;border-radius:12px;background:#111d1c;font-size:16px;line-height:1.5}
.vault-fact[hidden]{display:none}.vault-fact p{margin:0 0 10px}.vault-fact a{color:var(--cyan);font-size:14px;overflow-wrap:anywhere}.vault-fact a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0;padding:0;border:0}
.choice{display:flex;align-items:center;justify-content:center;width:100%;min-height:72px;padding:14px 16px;background:#171720;color:var(--white);border:1px solid #454552;border-radius:12px;font:800 16px/1.3 Arial,sans-serif;text-align:center;white-space:normal;overflow-wrap:anywhere;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background-color .16s ease}
.choice:last-child:nth-child(odd){grid-column:1 / -1}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}
.choice:focus-visible{outline:3px solid #f5ff37;outline-offset:4px}
.choice[aria-checked="true"]{border-color:var(--pink);background:#291520}
.choice:disabled{cursor:not-allowed;opacity:.58}
.status{min-height:24px;margin:18px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.meta{display:flex;justify-content:space-between;gap:16px;margin-top:14px;color:#858592;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.state-ready .status{color:var(--muted)}
.state-pending .status{color:var(--cyan)}
.state-correct .status,.state-completed .status{color:var(--green)}
.state-incorrect .status,.state-error .status{color:var(--pink)}
.state-locked .status,.state-limited .status{color:var(--yellow)}
@media (max-width:600px){
  body{padding:10px}
  .scene,.scene.has-guardian{width:100%;grid-template-columns:1fr;align-items:center}
  .scene.has-guardian .character-stage{min-height:190px;height:190px}
  .character-stage .guardian.visible{position:relative;width:150px;height:190px;opacity:1}
  .portal{inset:0 calc(50% - 85px);width:170px}
  .card{padding:20px 18px;border-radius:20px}
  .choices{grid-template-columns:1fr;gap:10px}
  .choice{justify-content:flex-start;min-height:48px;text-align:left;border-left:4px solid var(--cyan)}
  .choice:nth-child(2n){border-left-color:var(--pink)}
  .choice:nth-child(3n){border-left-color:var(--yellow)}
  .choice:last-child:nth-child(odd){grid-column:auto}
}
@keyframes guardian-breathe{50%{transform:translateY(-5px) rotate(.4deg)}}
@media (prefers-reduced-motion:reduce){.choice,.progress span,.environment{transition:none}.guardian{animation:none}}
.trail-notes{display:grid;gap:8px;margin:0 0 20px}.trail-notes[hidden],.keepsakes[hidden]{display:none}.trail-notes label{font-weight:800;color:var(--cyan)}.trail-notes textarea{width:100%;min-height:170px;resize:vertical;background:#15151d;color:#fff;border:1px solid #7b7b90;border-radius:10px;padding:12px;font:16px/1.5 Arial,sans-serif}.trail-notes textarea:focus-visible{outline:3px solid var(--yellow)}.keepsakes{max-height:280px;overflow:auto;padding:0 0 16px}.keepsakes p{border-left:3px solid var(--cyan);padding:8px 12px;margin:6px 0;font-size:14px;line-height:1.5}body.quiet .environment{filter:brightness(.3)!important}body.quiet .guardian{animation:none}body.quiet *{scroll-behavior:auto!important}.card>.popup-minimise{position:absolute;right:10px;top:8px}.eyebrow{padding-right:38px}
</style>
</head>
<body>
<img class="environment" id="environment" alt="" aria-hidden="true">
<div class="veil" aria-hidden="true"></div>
<main class="scene">
<div class="character-stage" id="characterStage"><div class="portal" id="portal" aria-hidden="true"></div><img class="guardian" id="guardian" alt=""></div>
<section class="card state-ready" id="card" data-state="ready">
  <div class="eyebrow" id="eyebrow"></div>
  <div class="progress" role="progressbar" aria-label="Question progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
  <h1 id="question">Loading the forest…</h1>
  <p class="hint" id="hint"></p>
  <aside class="vault-fact" id="vaultFact" aria-label="An oddity from The Alchemist’s vault" hidden><p id="factText"></p><a id="factSource" target="_blank" rel="noopener noreferrer"></a></aside>
  <div class="trail-notes" id="notesEditor" hidden><label for="trailNotes" id="notesLabel">My trail notes</label><textarea id="trailNotes" maxlength="1500"></textarea><small>Up to 1,500 characters. Choose Save notes to keep changes.</small></div>
  <div class="keepsakes" id="keepsakes" hidden></div>
  <div class="choices" id="choices" role="radiogroup" aria-labelledby="question"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="meta"><span id="metaStart"></span><span id="metaEnd"></span></div>
</section>
</main>
<script src="popupGems.js?v=hearth-20261127"></script>
<script src="rabbitQuestionView.js?v=hearth-20261127"></script>
<script>
const card=document.getElementById('card');
const scene=card.parentElement;
const environment=document.getElementById('environment');
const guardian=document.getElementById('guardian');
const eyebrow=document.getElementById('eyebrow');
const bar=document.getElementById('bar');
const progress=bar.parentElement;
const question=document.getElementById('question');
const hint=document.getElementById('hint');
const vaultFact=document.getElementById('vaultFact');
const factText=document.getElementById('factText');
const factSource=document.getElementById('factSource');
const choices=document.getElementById('choices');
const statusNode=document.getElementById('status');
const metaStart=document.getElementById('metaStart');
const metaEnd=document.getElementById('metaEnd');
const notesEditor=document.getElementById('notesEditor');
const trailNotes=document.getElementById('trailNotes');
const notesLabel=document.getElementById('notesLabel');
const keepsakes=document.getElementById('keepsakes');
let editorRevision=0;
let quietScene=false;
PopupGems.attach(scene,{key:'journey-scene',title:'Journey conversation',closeParent:card});
const stateClasses=['state-ready','state-pending','state-correct','state-incorrect','state-locked','state-completed','state-error','state-limited'];
let pending=false;
let currentRequestId='';
const text=(node,value)=>{node.textContent=String(value||'')};
const setState=kind=>{stateClasses.forEach(name=>card.classList.remove(name));card.classList.add('state-'+kind);card.dataset.state=kind};
const portal=document.getElementById('portal');
let sceneRevision=0;
let sceneIdentity='';
let latestArtwork=null;
const localEnvironment=artwork=>{const hour=new Date().getHours();return hour>=6&&hour<18?artwork.environmentDay:artwork.environmentNight};
const animateScene=async(node,frames,duration)=>{
  if(quietScene||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const animation=node.animate(frames,{duration,fill:'forwards',easing:'ease-in-out'});
  try{await animation.finished}catch(_){/* A newer scene replaced this transition. */}
};
const showScene=async artwork=>{
  latestArtwork=artwork;
  const identity=artwork.environment+'|'+(artwork.guardian||'');
  if(identity===sceneIdentity){environment.src=localEnvironment(artwork);return}
  sceneIdentity=identity;
  const revision=++sceneRevision;
  [portal,guardian,environment].forEach(node=>node.getAnimations().forEach(animation=>animation.cancel()));
  if(guardian.classList.contains('visible')){
    await animateScene(portal,[{opacity:0,transform:'scaleX(0)'},{opacity:1,transform:'scaleX(1)'}],380);
    if(revision!==sceneRevision)return;
    await animateScene(guardian,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.15)'}],420);
    if(revision!==sceneRevision)return;
    await animateScene(portal,[{opacity:1,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(0)'}],300);
    if(revision!==sceneRevision)return;
  }
  guardian.classList.remove('visible');
  guardian.getAnimations().forEach(animation=>animation.cancel());
  await animateScene(environment,[{opacity:1},{opacity:0}],200);
  if(revision!==sceneRevision)return;
  environment.src=localEnvironment(artwork);
  document.body.dataset.character=(artwork.guardian||'').split('/').pop().split('.')[0].replace(/-v\d+$/,'');
  await animateScene(environment,[{opacity:0},{opacity:1}],250);
  if(revision!==sceneRevision)return;
  scene.classList.toggle('has-guardian',Boolean(artwork.guardian));
  if(!artwork.guardian){guardian.removeAttribute('src');guardian.alt='';return}
  guardian.src=artwork.guardian;guardian.alt=artwork.guardianAlt;
  await animateScene(portal,[{opacity:0,transform:'scaleX(0)'},{opacity:1,transform:'scaleX(1)'}],380);
  if(revision!==sceneRevision)return;
  guardian.classList.add('visible');
  await animateScene(guardian,[{opacity:0,transform:'scale(.15)'},{opacity:1,transform:'scale(1)'}],420);
  if(revision!==sceneRevision)return;
  guardian.getAnimations().forEach(animation=>animation.cancel());
  await animateScene(portal,[{opacity:1,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(0)'}],300);
};
// Follow the player's device timezone, including when a sleeping tab is resumed.
setInterval(()=>{if(latestArtwork)environment.src=localEnvironment(latestArtwork)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&latestArtwork)environment.src=localEnvironment(latestArtwork)});
const render=view=>{
  pending=view.status.kind==='pending';
  quietScene=view.quiet;document.body.classList.toggle('quiet',quietScene);
  notesEditor.hidden=!view.editor;
  if(view.editor){text(notesLabel,view.editor.label);if(view.status.kind!=='error')trailNotes.value=view.editor.value;editorRevision=view.editor.revision;}
  keepsakes.hidden=!view.details.length;keepsakes.replaceChildren();
  view.details.forEach(item=>{const row=document.createElement('p');const title=document.createElement('strong');text(title,item.title);row.append(title,document.createElement('br'),document.createTextNode(item.text));keepsakes.append(row)});
  setState(view.status.kind);
  text(eyebrow,view.eyebrow);
  text(question,view.question);
  text(hint,view.hint+(view.checkpointAt?' Last saved at '+new Date(view.checkpointAt).toLocaleString()+'.':''));
  vaultFact.hidden=!view.fact;
  if(view.fact){text(factText,view.fact.text);text(factSource,'Source: '+view.fact.sourceTitle+' (opens in a new tab)');factSource.href=view.fact.sourceUrl}
  else{text(factText,'');text(factSource,'');factSource.removeAttribute('href')}
  text(statusNode,view.status.message);
  text(metaStart,view.meta[0]);
  text(metaEnd,view.meta[1]);
  bar.style.width=view.progress.percent+'%';
  progress.setAttribute('aria-valuenow',String(view.progress.percent));
  showScene(view.artwork);
  choices.replaceChildren();
  view.choices.forEach(item=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='choice';
    button.setAttribute('role','radio');
    button.setAttribute('aria-checked','false');
    button.disabled=view.disabled||item.disabled;
    text(button,item.label);
    button.addEventListener('click',()=>{
      if(pending)return;
      pending=true;
      currentRequestId='q-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
      setState('pending');
      text(statusNode,'The forest is listening…');
      [...choices.children].forEach(control=>{control.disabled=true;control.setAttribute('aria-checked',String(control===button))});
      parent.postMessage({type:'RABBIT_QUESTION_ACTION',requestId:currentRequestId,action:item.action,choiceId:item.id,...(item.id==='save-notes'?{value:trailNotes.value,revision:editorRevision}:{})},'*');
    });
    choices.appendChild(button);
  });
};
window.addEventListener('message',event=>{
  if(event.source!==parent)return;
  const data=event.data||{};
  if(data.type==='RABBIT_QUESTION_RENDER'){
    const message=RabbitQuestionView.normaliseRenderMessage(data);
    if(message){currentRequestId=message.requestId;render(message.payload)}
    return;
  }
  if(data.type==='RABBIT_QUESTION_RESULT'&&data.requestId===currentRequestId){
    const view=RabbitQuestionView.buildQuestionView(data.payload);
    if(view.valid)render(view);
  }
});
parent.postMessage({type:'RABBIT_QUESTION_READY'},'*');
</script>
</body>
</html>
